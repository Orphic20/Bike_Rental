name: Rental lifecycle sweep

on:
  schedule:
    # GitHub cron is UTC. 11:05 UTC is 7:05 PM Asia/Manila.
    - cron: "5 11 * * *"
  workflow_dispatch:

concurrency:
  group: rental-lifecycle-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Run no-show and overdue sweep
        env:
          AUTOMATION_URL: ${{ secrets.AUTOMATION_URL }}
          AUTOMATION_SECRET: ${{ secrets.AUTOMATION_SECRET }}
        run: |
          set -euo pipefail
          test -n "$AUTOMATION_URL"
          test -n "$AUTOMATION_SECRET"
          base="${AUTOMATION_URL%/}"

          # Wake a sleeping Render instance first. Retries belong here, not on
          # the POST: retrying a hung sweep stacks behind the request still
          # running on the only web worker.
          woke=0
          for _ in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error \
              --connect-timeout 15 \
              --max-time 30 \
              "$base/health"; then
              woke=1
              break
            fi
            sleep 10
          done
          test "$woke" -eq 1

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --connect-timeout 20 \
            --max-time 90 \
            --request POST \
            --header "X-Cron-Secret: $AUTOMATION_SECRET" \
            "$base/internal/jobs/lifecycle-sweep"
